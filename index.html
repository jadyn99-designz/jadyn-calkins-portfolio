  <style>
    :root {
      --black: #0D0D0D;
      --cream: #F2EDE4;
      --red: #E8272A;
      --yellow: #F5C842;
      --blue: #1A6BFF;
      --green: #2ECC40;
      --concrete: #8A8A8A;
      --dark-bg: #1A1A2E;

      --pixel-shadow: 4px 4px 0px var(--black);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      background: var(--dark-bg);
      color: var(--cream);
      font-family: 'Space Mono', monospace;
      font-size: 16px;
      line-height: 1.7;
      border-radius: 0;
    }

    /* Body text = Space Mono only, min 16px, line-height 1.7 */
    p, li, a, span, blockquote, label, input, textarea, button {
      font-family: 'Space Mono', monospace;
      font-size: 16px;
      line-height: 1.7;
    }

    /* Headlines = Bebas Neue only */
    h1, h2, h3, h4, h5, h6 {
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 0.02em;
      margin: 0;
    }

    /* UI labels = Press Start 2P only */
    .ui-label {
      font-family: 'Press Start 2P', monospace;
      text-transform: uppercase;
    }

    /* No rounded corners, no drop shadows anywhere; only hard pixel shadows */
    * {
      border-radius: 0;
    }

    /* Scanline overlay */
    body::after {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 999;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.03) 0px,
        rgba(0, 0, 0, 0.03) 1px,
        transparent 1px,
        transparent 2px
      );
    }

    /* -------------------------------------------------------------------
       PIXEL SKATER  (one div; box-shadow paints the whole 32x32 sprite)
       ------------------------------------------------------------------- */
    .skater {
      position: fixed;
      bottom: 80px;
      left: 0;
      z-index: 1; /* skates through the scene, behind hero text/buttons */
      width: 96px;
      height: 96px;
      cursor: pointer;
      /* travels across the sidewalk, left to right, looping */
      animation: skate-across 16s linear infinite;
    }

    /* paused while doing a trick so you can see the kickflip */
    .skater.is-trick { animation-play-state: paused; }

    .skater-bob {
      width: 100%;
      height: 100%;
      transform-origin: bottom center;
      animation: idle-bounce 1s ease-in-out infinite;
    }

    .skater .sprite {
      position: absolute;
      top: 0;
      left: 0;
      width: 3px;
      height: 3px;
      background: transparent;
    }

    @keyframes idle-bounce {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(3px); }
    }

    @keyframes skate-across {
      from { transform: translateX(-140px); }
      to   { transform: translateX(calc(100vw + 60px)); }
    }

    @media (prefers-reduced-motion: reduce) {
      .skater { animation: none; left: 5vw; }
      .skater-bob { animation: none; }
    }

    /* -------------------------------------------------------------------
       GROUND STRIP  (cracked pixel sidewalk)
       ------------------------------------------------------------------- */
    .ground {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60px;
      z-index: 99;
    }

    .ground svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* -------------------------------------------------------------------
       NAV  (fixed pixel bar; Press Start 2P = UI labels only)
       ------------------------------------------------------------------- */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 5vw;
      background: var(--black);
      border-bottom: 4px solid var(--red);
    }

    .nav__logo {
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      color: var(--cream);
      text-decoration: none;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      line-height: 1;
    }

    .nav__logo .mark {
      width: 14px;
      height: 14px;
      background: var(--yellow);
      box-shadow: 4px 4px 0 0 var(--red);
      display: inline-block;
    }

    .nav__logo .dot { font: inherit; color: var(--red); }

    .nav__links {
      display: flex;
      align-items: center;
      gap: clamp(16px, 3vw, 44px);
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .nav__links a {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      line-height: 1;
      color: var(--cream);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: inline-block;
      transition: color 0.12s steps(2), transform 0.12s steps(2);
    }

    .nav__links a:hover {
      color: var(--yellow);
      transform: translate(-2px, -2px);
    }

    /* -------------------------------------------------------------------
       HERO
       ------------------------------------------------------------------- */
    .hero {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      padding: 112px 5vw 150px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      /* faint pixel-dot grid */
      background-image: radial-gradient(var(--concrete) 1px, transparent 1px);
      background-size: 24px 24px;
      background-position: -1px -1px;
    }

    /* dim the grid so it stays subtle over the dark bg */
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--dark-bg);
      opacity: 0.92;
      z-index: 0;
    }

    .hero__inner {
      position: relative;
      z-index: 2;
      max-width: 960px;
    }

    /* status badge + role line row */
    .hero__top {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 26px;
    }

    .badge {
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--cream);
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 9px 12px;
      border: 2px solid var(--green);
      background: rgba(46, 204, 64, 0.08);
    }

    .badge .pulse {
      width: 9px;
      height: 9px;
      background: var(--green);
      display: inline-block;
      animation: blink 1.1s steps(2) infinite;
    }

    @keyframes blink {
      0%, 49%  { opacity: 1; }
      50%, 100% { opacity: 0.25; }
    }

    .hero__eyebrow {
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      line-height: 1.6;
      color: var(--green);
      text-transform: uppercase;
      letter-spacing: 1px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin: 0;
    }

    .hero__eyebrow::before {
      content: "";
      width: 30px;
      height: 4px;
      background: var(--green);
      display: inline-block;
    }

    .hero h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(72px, 15vw, 220px);
      line-height: 0.85;
      color: var(--cream);
      margin: 0;
    }

    /* spans inside the headline must keep the h1 font, not the global span rule */
    .hero h1 span { font: inherit; }

    .hero h1 .outline {
      color: transparent;
      -webkit-text-stroke: 2px var(--cream);
      text-stroke: 2px var(--cream);
    }

    .hero h1 .dot { color: var(--red); }

    .hero__sub {
      max-width: 560px;
      margin-top: 24px;
      color: var(--cream);
    }

    .hero__sub strong { color: var(--yellow); }

    .hero__cta {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin-top: 34px;
    }

    .btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      line-height: 1;
      text-transform: uppercase;
      text-decoration: none;
      letter-spacing: 1px;
      padding: 18px 24px;
      display: inline-block;
      border: 3px solid var(--black);
      box-shadow: var(--pixel-shadow);
      transition: transform 0.1s steps(2), box-shadow 0.1s steps(2);
    }

    .btn--primary { background: var(--red); color: var(--cream); }
    .btn--ghost { background: var(--cream); color: var(--black); }

    .btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px var(--black);
    }

    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px var(--black);
    }

    /* Decorative offset pixel blocks (designer flourish) */
    .hero__decor {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .hero__decor span {
      position: absolute;
      display: block;
      box-shadow: var(--pixel-shadow);
      animation: float 6s ease-in-out infinite;
    }

    .hero__decor .b1 { top: 18%; right: 8vw; width: 64px; height: 64px; background: var(--yellow); animation-delay: 0s; }
    .hero__decor .b2 { top: 30%; right: 16vw; width: 36px; height: 36px; background: var(--blue); animation-delay: -2s; }
    .hero__decor .b3 { top: 24%; right: 4vw; width: 24px; height: 24px; background: var(--green); animation-delay: -4s; }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-14px); }
    }

    /* Social links row */
    .hero__socials {
      display: flex;
      flex-wrap: wrap;
      gap: clamp(16px, 3vw, 32px);
      margin-top: 30px;
      padding-top: 22px;
      border-top: 2px solid rgba(242, 237, 228, 0.12);
    }

    .hero__socials a {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      line-height: 1;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--concrete);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: color 0.12s steps(2), transform 0.12s steps(2);
    }

    .hero__socials a::before {
      content: "";
      width: 8px;
      height: 8px;
      background: currentColor;
      display: inline-block;
    }

    .hero__socials a:hover { color: var(--yellow); transform: translate(-2px, -2px); }

    /* -------------------------------------------------------------------
       MOBILE
       ------------------------------------------------------------------- */
    @media (max-width: 768px) {
      /* scale via the bob's keyframes so it doesn't fight the travel transform */
      @keyframes idle-bounce {
        0%, 100% { transform: scale(0.6) translateY(0); }
        50%      { transform: scale(0.6) translateY(3px); }
      }
      .ground {
        height: 40px;
      }

      .nav {
        padding: 14px 6vw;
      }
      .nav__logo { font-size: 11px; gap: 9px; }
      .nav__logo .mark { width: 11px; height: 11px; box-shadow: 3px 3px 0 0 var(--red); }
      .nav__links { gap: 14px; }

  <script>

    (function () {
      var skater = document.querySelector('.skater');
      if (!skater) return;
      var busy = false;
      skater.addEventListener('click', function () {
        if (busy) return;
        busy = true;
        skater.classList.add('is-trick');
        skater.classList.remove('skater-cruise');
        skater.classList.add('skater-trick');
        setTimeout(function () {
          skater.classList.remove('skater-trick');
          skater.classList.add('skater-cruise');
          skater.classList.remove('is-trick');
          busy = false;
