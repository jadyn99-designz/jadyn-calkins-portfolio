  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root {
      --black: #0D0D0D;
      --cream: #F2EDE4;
      --red: #E8272A;
      --yellow: #F5C842;
      --blue: #1A6BFF;
      --green: #2ECC40;
      --cyan: #2DE2E6;
      --concrete: #8A8A8A;
      --dark-bg: #0A0A10;

      --pixel-shadow: 4px 4px 0px var(--black);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      background: var(--dark-bg);
      color: var(--cream);
      font-family: 'Space Mono', monospace;
      font-size: 16px;
      line-height: 1.7;
      border-radius: 0;
    }

    /* Body text = Space Mono only, min 16px, line-height 1.7 */
    p, li, a, span, blockquote, label, input, textarea, button {
      font-family: 'Space Mono', monospace;
      font-size: 16px;
      line-height: 1.7;
    }

    /* Headlines = Bebas Neue only */
    h1, h2, h3, h4, h5, h6 {
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 0.02em;
      margin: 0;
    }

    /* UI labels = Press Start 2P only */
    .ui-label {
      font-family: 'Press Start 2P', monospace;
      text-transform: uppercase;
    }

    /* No rounded corners, no drop shadows anywhere; only hard pixel shadows */
    * {
      border-radius: 0;
    }

    /* Scanline overlay */
    body::after {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 999;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.03) 0px,
        rgba(0, 0, 0, 0.03) 1px,
        transparent 1px,
        transparent 2px
      );
    }

    /* -------------------------------------------------------------------
       PIXEL SKATER  (one div; box-shadow paints the whole 32x32 sprite)
       ------------------------------------------------------------------- */
    .skater {
      position: absolute;
      bottom: 46px; /* stands on top of the sidewalk strip */
      left: 0;
      z-index: 2;
      width: 96px;
      height: 96px;
      cursor: pointer;
      /* rolls along the sidewalk, left to right, looping */
      animation: skate-across 16s linear infinite;
    }

    /* paused while doing a trick so you can see the kickflip */
    .skater.is-trick { animation-play-state: paused; }

    .skater-bob {
      --sc: 1; /* sprite scale (shrinks on mobile) */
      width: 100%;
      height: 100%;
      transform-origin: bottom center;
      animation: idle-bounce 1s ease-in-out infinite;
    }

    /* air trick: jump (+ optional spin) launched by the trick buttons */
    .skater-bob.trick-air {
      transform-origin: center;
      animation: trick-air 760ms ease-out forwards;
    }

    .skater .sprite {
      position: absolute;
      top: 0;
      left: 0;
      width: 3px;
      height: 3px;
      background: transparent;
    }

    @keyframes idle-bounce {
      0%, 100% { transform: scale(var(--sc)) translateY(0); }
      50%      { transform: scale(var(--sc)) translateY(3px); }
    }

    @keyframes trick-air {
      0%   { transform: scale(var(--sc)) translateY(0) rotate(0deg); }
      30%  { transform: scale(var(--sc)) translateY(calc(-1 * var(--jump, 78px))) rotate(calc(var(--spin, 0deg) * 0.4)); }
      62%  { transform: scale(var(--sc)) translateY(calc(-1 * var(--jump, 78px))) rotate(calc(var(--spin, 0deg) * 0.78)); }
      100% { transform: scale(var(--sc)) translateY(0) rotate(var(--spin, 0deg)); }
    }

    @keyframes skate-across {
      from { transform: translateX(-140px); }
      to   { transform: translateX(calc(100vw + 60px)); }
    }

    @media (prefers-reduced-motion: reduce) {
      .skater { animation: none; left: 5vw; }
      .skater-bob { animation: none; }
    }

    /* -------------------------------------------------------------------
       TRICK DECK  (buttons that launch the skater into tricks)
       ------------------------------------------------------------------- */
    .tricks {
      position: absolute;
      right: 5vw;
      bottom: 156px;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 12px;
      text-align: right;
    }

    .tricks__label {
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      line-height: 1.5;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--cyan);
    }

    .tricks__grid {
      display: grid;
      grid-template-columns: repeat(2, auto);
      gap: 10px;
    }

    .trick-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      line-height: 1;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--yellow);
      background: transparent;
      border: 2px solid var(--yellow);
      padding: 11px 12px;
      cursor: pointer;
      box-shadow: 3px 3px 0 rgba(245, 200, 66, 0.3);
      transition: transform 0.1s steps(2), background-color 0.1s steps(2),
                  color 0.1s steps(2), box-shadow 0.1s steps(2);
    }

    .trick-btn:hover {
      background: var(--yellow);
      color: var(--black);
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0 rgba(245, 200, 66, 0.3);
    }

    .trick-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0 0 0 rgba(0, 0, 0, 0);
    }

    /* -------------------------------------------------------------------
       SCENE  (ground band at the bottom of the hero; scrolls with the page)
       ------------------------------------------------------------------- */
    .scene {
      position: relative;
      z-index: 1;
      flex: 0 0 auto;
      width: 100%;
      height: 130px;
    }

    /* cracked pixel sidewalk, built in CSS so it scales proportionally */
    .ground {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 46px;
      background-color: var(--concrete);
      background-image:
        /* fine speckle */
        radial-gradient(rgba(0, 0, 0, 0.16) 1px, transparent 1px),
        /* slab seams */
        repeating-linear-gradient(90deg,
          transparent 0 76px,
          #5A5A5A 76px 79px),
        /* curb light top + shaded bottom */
        linear-gradient(180deg,
          #A2A2A2 0 4px,
          #8A8A8A 4px 36px,
          #6E6E6E 36px 46px);
      background-size: 14px 14px, auto, auto;
      image-rendering: pixelated;
    }

    /* a couple of pixel cracks for character */
    .ground::before,
    .ground::after {
      content: "";
      position: absolute;
      background: #3A3A3A;
    }
    .ground::before {
      left: 22%;
      top: 6px;
      width: 3px;
      height: 22px;
      box-shadow: 3px 10px 0 #3A3A3A, 6px 10px 0 #3A3A3A;
    }
    .ground::after {
      left: 68%;
      top: 12px;
      width: 3px;
      height: 18px;
      box-shadow: -3px 8px 0 #3A3A3A, -6px 8px 0 #3A3A3A;
    }

    /* -------------------------------------------------------------------
       NAV  (fixed pixel bar; Press Start 2P = UI labels only)
       ------------------------------------------------------------------- */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 5vw;
      background: var(--black);
      border-bottom: 4px solid var(--red);
    }

    .nav__logo {
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      color: var(--cream);
      text-decoration: none;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      line-height: 1;
    }

    .nav__logo-img {
      height: 34px;
      width: auto;
      display: block;
      image-rendering: pixelated; /* keep the pixel art crisp */
    }

    .nav__logo .dot { font: inherit; color: var(--red); }

    .nav__links {
      display: flex;
      align-items: center;
      gap: clamp(16px, 3vw, 44px);
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .nav__links a {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      line-height: 1;
      color: var(--cream);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: inline-block;
      transition: color 0.12s steps(2), transform 0.12s steps(2);
    }

    .nav__links a:hover {
      color: var(--yellow);
      transform: translate(-2px, -2px);
    }

    /* -------------------------------------------------------------------
       HERO
       ------------------------------------------------------------------- */
    .hero {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      padding: 100px 0 0;
      display: flex;
      flex-direction: column;
      /* faint pixel-dot grid */
      background-image: radial-gradient(var(--concrete) 1px, transparent 1px);
      background-size: 24px 24px;
      background-position: -1px -1px;
    }

    /* dim the grid so it stays subtle over the dark bg */
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--dark-bg);
      opacity: 0.92;
      z-index: 0;
    }

    /* text column: grows to fill the space above the scene and centers content */
    .hero__inner {
      position: relative;
      z-index: 2;
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 100%;
      max-width: 1040px;
      padding: 32px 5vw;
    }

    /* status badge + role line row */
    .hero__top {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 26px;
    }

    .badge {
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--cream);
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 9px 12px;
      border: 2px solid var(--cyan);
      background: rgba(45, 226, 230, 0.10);
      color: var(--cyan);
    }

    .badge .pulse {
      width: 9px;
      height: 9px;
      background: var(--cyan);
      display: inline-block;
      animation: blink 1.1s steps(2) infinite;
    }

    @keyframes blink {
      0%, 49%  { opacity: 1; }
      50%, 100% { opacity: 0.25; }
    }

    .hero__eyebrow {
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      line-height: 1.6;
      color: var(--cyan);
      text-transform: uppercase;
      letter-spacing: 1px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin: 0;
    }

    .hero__eyebrow::before {
      content: "";
      width: 30px;
      height: 4px;
      background: var(--cyan);
      display: inline-block;
    }

    .hero h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(64px, 12.5vw, 184px);
      line-height: 0.85;
      color: var(--cream);
      margin: 0;
    }

    /* spans inside the headline must keep the h1 font, not the global span rule */
    .hero h1 span { font: inherit; }

    /* solid cream with a hard pixel-offset shadow (on-brand, renders clean) */
    .hero h1 .accent {
      color: var(--cream);
      text-shadow: 6px 6px 0 var(--red);
    }

    .hero h1 .dot { color: var(--red); }

    .hero__sub {
      max-width: 560px;
      margin-top: 24px;
      color: var(--cream);
    }

    .hero__sub strong { color: var(--yellow); }

    .hero__cta {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin-top: 34px;
    }

    .btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      line-height: 1;
      text-transform: uppercase;
      text-decoration: none;
      letter-spacing: 1px;
      padding: 18px 24px;
      display: inline-block;
      border: 3px solid var(--black);
      box-shadow: var(--pixel-shadow);
      transition: transform 0.1s steps(2), box-shadow 0.1s steps(2);
    }

    .btn--primary { background: var(--red); color: var(--cream); }
    .btn--ghost { background: var(--cream); color: var(--black); }

    .btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px var(--black);
    }

    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px var(--black);
    }

    /* Decorative offset pixel blocks (designer flourish) */
    .hero__decor {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .hero__decor span {
      position: absolute;
      display: block;
      box-shadow: var(--pixel-shadow);
      animation: float 6s ease-in-out infinite;
    }

    .hero__decor .b1 { top: 18%; right: 8vw; width: 64px; height: 64px; background: var(--yellow); animation-delay: 0s; }
    .hero__decor .b2 { top: 30%; right: 16vw; width: 36px; height: 36px; background: var(--blue); animation-delay: -2s; }
    .hero__decor .b3 { top: 24%; right: 4vw; width: 24px; height: 24px; background: var(--green); animation-delay: -4s; }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-14px); }
    }

    /* Social links row */
    .hero__socials {
      display: flex;
      flex-wrap: wrap;
      gap: clamp(16px, 3vw, 32px);
      margin-top: 30px;
      padding-top: 22px;
      border-top: 2px solid rgba(242, 237, 228, 0.12);
    }

    .hero__socials a {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      line-height: 1;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--concrete);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: color 0.12s steps(2), transform 0.12s steps(2);
    }

    .hero__socials a::before {
      content: "";
      width: 8px;
      height: 8px;
      background: currentColor;
      display: inline-block;
    }

    .hero__socials a:hover { color: var(--cyan); transform: translate(-2px, -2px); }

    /* -------------------------------------------------------------------
       MOBILE
       ------------------------------------------------------------------- */
    @media (max-width: 768px) {
      /* shrink the skater via the scale variable (keeps tricks/bounce in sync) */
      .skater-bob { --sc: 0.62; }
      .scene { height: 92px; }
      .ground { height: 34px; }
      .skater { bottom: 34px; }

      /* flow it in below the content (sits above the sidewalk) to avoid overlap */
      .tricks {
        position: static;
        align-items: center;
        text-align: center;
        padding: 20px 6vw 6px;
        gap: 12px;
      }
      .tricks__grid { gap: 8px; }
      .trick-btn { font-size: 8px; padding: 9px 8px; }

      .nav {
        padding: 14px 6vw;
      }
      .nav__logo { font-size: 11px; gap: 9px; }
      .nav__logo-img { height: 28px; }
      .nav__links { gap: 14px; }
      .nav__links a { font-size: 8px; letter-spacing: 0; }

      .hero {
        padding: 90px 0 0;
      }
      .hero__inner { padding: 24px 6vw; }
      .hero__sub { font-size: 16px; }
      .hero__eyebrow { font-size: 10px; }
      /* hide blocks that collide with the headline/role text on narrow screens */
      .hero__decor .b1 { display: none; }
      .hero__decor .b2 { width: 26px; height: 26px; top: 12%; right: 8vw; }
      .hero__decor .b3 { display: none; }
    }
  </style>
</head>
<body id="top">

  <!-- Navigation -->
  <nav class="nav">
    <a class="nav__logo" href="#top">
      <img class="nav__logo-img" src="assets/logo.png" alt="Jadyn Calkins logo">JADYN<span class="dot">.</span>
    </a>
    <ul class="nav__links">
      <li><a href="#work">Work</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <!-- Hero -->
  <header class="hero" id="home">
    <div class="hero__decor" aria-hidden="true">
      <span class="b1"></span>
      <span class="b2"></span>
      <span class="b3"></span>
    </div>
    <div class="hero__inner">
      <div class="hero__top">
        <span class="badge"><i class="pulse"></i>Available for work</span>
        <p class="hero__eyebrow">Product Designer / UI&middot;UX Designer</p>
      </div>
      <h1>Jadyn<br><span class="accent">Calkins</span><span class="dot">.</span></h1>
      <p class="hero__sub">
        I design <strong>intuitive, user-centered products</strong> and digital
        experiences &mdash; built to move, not sit still.
      </p>
      <div class="hero__cta">
        <a class="btn btn--primary" href="#work">View Work</a>
        <a class="btn btn--ghost" href="#contact">Get in Touch</a>
      </div>
      <nav class="hero__socials" aria-label="Social links">
        <a href="mailto:jadyncalkins0@gmail.com">Email</a>
        <a href="https://www.linkedin.com/" target="_blank" rel="noopener">LinkedIn</a>
        <a href="https://dribbble.com/" target="_blank" rel="noopener">Dribbble</a>
        <a href="https://github.com/jadyn99-designz" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </div>

    <!-- Trick deck: make the skater do tricks -->
    <div class="tricks">
      <span class="tricks__label">&#9656; Make me skate</span>
      <div class="tricks__grid">
        <button type="button" class="trick-btn" data-trick="ollie">Ollie</button>
        <button type="button" class="trick-btn" data-trick="kickflip">Kickflip</button>
        <button type="button" class="trick-btn" data-trick="shuv">Shuv</button>
        <button type="button" class="trick-btn" data-trick="flip360">360 Flip</button>
      </div>
    </div>

    <!-- Ground band: skater rolls along the sidewalk; scrolls with the hero -->
    <div class="scene">
      <!-- Pixel skater character (also clickable for a random trick) -->
      <div class="skater skater-cruise" title="click me for a random trick">
        <div class="skater-bob">
          <div class="sprite"></div>
        </div>
      </div>
      <div class="ground" aria-hidden="true"></div>
    </div>
  </header>

  <script>
    // Trick deck: buttons (and clicking the skater) launch air tricks.
    (function () {
      var skater = document.querySelector('.skater');
      var bob = document.querySelector('.skater-bob');
      if (!skater || !bob) return;

      // each trick = which pose sprite + how high it jumps + how far it spins
      var POSE = {
        ollie:    'skater-ollie',
        kickflip: 'skater-trick',
        shuv:     'skater-ollie',
        flip360:  'skater-trick'
      };
      var CFG = {
        ollie:    { jump: '80px', spin: '0deg' },
        kickflip: { jump: '72px', spin: '0deg' },
        shuv:     { jump: '60px', spin: '360deg' },
        flip360:  { jump: '98px', spin: '360deg' }
      };

      var busy = false;
      function doTrick(name) {
        var cfg = CFG[name];
        if (busy || !cfg) return;
        busy = true;
        skater.classList.add('is-trick');        // pause cruising
        skater.classList.remove('skater-cruise');
        skater.classList.add(POSE[name]);
        bob.style.setProperty('--jump', cfg.jump);
        bob.style.setProperty('--spin', cfg.spin);
        bob.classList.add('trick-air');
        setTimeout(function () {
          bob.classList.remove('trick-air');
          skater.classList.remove(POSE[name]);
          skater.classList.add('skater-cruise');
          skater.classList.remove('is-trick');
          busy = false;
        }, 780);
      }

      document.querySelectorAll('.trick-btn').forEach(function (b) {
        b.addEventListener('click', function () { doTrick(b.dataset.trick); });
      });

      // clicking the skater itself fires a random trick
      var names = Object.keys(CFG);
      skater.addEventListener('click', function () {
        doTrick(names[Math.floor(Math.random() * names.length)]);
      });
    })();
  </script>

</body>
</html>
